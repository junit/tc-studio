services:
  tc-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: tc-studio:local
    ports:
      - "${TC_STUDIO_PORT:-8000}:8000"
    environment:
      TC_STUDIO_APP_ENV: "${TC_STUDIO_APP_ENV:-production}"
      TC_STUDIO_AUTH_ENABLED: "${TC_STUDIO_AUTH_ENABLED:-true}"
      TC_STUDIO_DATABASE_URL: "sqlite:////var/lib/tc-studio/tc_studio.sqlite3"
      TC_STUDIO_DATA_DIR: "/var/lib/tc-studio/data"
      TC_STUDIO_STORAGE_DIR: "/var/lib/tc-studio/storage"
      TC_STUDIO_RESULTS_DIR: "/var/lib/tc-studio/storage/batch_results"
      TC_STUDIO_HISTORY_PATH: "/var/lib/tc-studio/storage/history.json"
    volumes:
      - tc_studio_data:/var/lib/tc-studio
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  tc_studio_data:
