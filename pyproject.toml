[project]
name = "tc-studio"
version = "0.1.0"
description = "TC Studio backend for Tencent Cloud multi-service APIs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.28,<1",
    "pydantic>=2,<3",
    "python-multipart>=0.0.9,<1",
    "requests>=2.31,<3",
    "PyJWT[crypto]>=2.8,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "python-docx>=1.1,<2",
    "pypdf>=5,<7",
    "Pillow>=10,<13",
    "smolagents>=1.26,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "pytest-asyncio>=0.23,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]
